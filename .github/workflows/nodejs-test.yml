name: Node.js Tests

on: [push, pull_request]

jobs:
  # Run tests with 'pnpm install --frozen-lockfile' dependencies
  tests-with-pck-lock-dependencies:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.19.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 8.x.x
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Restore old config for Node 16, 18 & 20
      - run: |
          if [[ $(node -v | grep -E '^v(16|18|20)\.') ]]; then
            cp .mocharc.old.json .mocharc.json
          fi
      - run: pnpm test

  # Run tests with 'pnpm i' dependencies
  tests-with-pck-dependencies:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.19.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 8.x.x
          run_install: false
      - run: pnpm i
      # Restore old config for Node 16, 18 & 20
      - run: |
          if [[ $(node -v | grep -E '^v(16|18|20)\.') ]]; then
            cp .mocharc.old.json .mocharc.json
          fi
      - run: pnpm test
